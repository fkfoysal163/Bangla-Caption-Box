<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন লগইন - বাংলা ক্যাপশন বক্স</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900">🇧🇩 বাংলা ক্যাপশন বক্স</h1>
            <p class="text-gray-600 text-sm mt-1">এডমিন প্যানেলে লগইন করুন</p>
        </div>

        <!-- Alert Message -->
        <div id="errorMessage" class="hidden bg-red-100 text-red-700 text-sm p-3 rounded-lg mb-4 text-center"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">ইমেইল</label>
                <input type="email" id="email" required placeholder="admin@example.com" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">পাসওয়ার্ড</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                লগইন করুন
            </button>
        </form>
    </div>

    <!-- Firebase SDKs (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script>
        // আপনার ফায়ারবেস প্রজেক্টের কনফিগারেশন এখানে বসান (যা আপনার app.js এও আছে)
        const firebaseConfig = {
            apiKey: "AIzaSyD9Q2CT4bGYaGqs4uYHiROZRngfw2ZvPx0",
            authDomain: "bangla-caption-box.firebaseapp.com",
            projectId: "bangla-caption-box",
            storageBucket: "bangla-caption-box.firebasestorage.app",
            messagingSenderId: "316786933376",
            appId: "1:316786933376:android:9c391c5930f0b0bc6bb065"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ইউজার যদি ইতিমধ্যে লগইন করা থাকে, তবে সরাসরি ড্যাশবোর্ড (index.html) এ পাঠিয়ে দেবে
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        // লগইন বাটন ক্লিক করলে রান হবে
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            btn.innerText = "অপেক্ষা করুন...";
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // সফলভাবে লগইন হলে index.html এ চলে যাবে
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    btn.innerText = "লগইন করুন";
                    btn.disabled = false;
                    errorDiv.classList.remove('hidden');
                    
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        errorDiv.innerText = "ভুল ইমেইল অথবা পাসওয়ার্ড দিয়েছেন!";
                    } else if (error.code === 'auth/invalid-email') {
                        errorDiv.innerText = "সঠিক ইমেইল ঠিকানা দিন!";
                    } else {
                        errorDiv.innerText = "লগইন করতে সমস্যা হচ্ছে: " + error.message;
                    }
                });
        }
    </script>
</body>
</html>
